android.useAndroidX=true
android.enableJetifier=true
# Augmentation de la mémoire et forçage de l'encodage
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# DÉSACTIVATION des fonctions qui causent le "State Lock" dans l'IDE
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=false
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false
# Paramètres Kotlin et KSP pour éviter les conflits de threads
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx2048m -Dkotlin.daemon.client.alive.timeout.resend.millis=300
ksp.useKSP2=false
ksp.incremental=false
